// ============================================================
//  拖拽 Drag-and-drop
// ============================================================
let dragState = null;
const DRAG_DELAY = 800; // ms before drag starts
const DRAG_THRESHOLD = 5; // px movement before canceling click

function startDrag(e, taskId) {
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  const row = leftBody.querySelector(`[data-id="${taskId}"]`);
  if (!row) return;

  dragState = {
    taskId,
    startX: e.clientX,
    startY: e.clientY,
    timer: null,
    isDragging: false,
    ghostEl: null,
    indicatorEl: null,
    offsetX: 0
  };

  dragState.timer = setTimeout(() => {
    if (!dragState || dragState.isDragging) return;
    beginDrag(taskId, row, e.clientX, e.clientY);
  }, DRAG_DELAY);
}

function beginDrag(taskId, row, x, y) {
  if (!dragState) return;
  dragState.isDragging = true;

  // Dim the original row
  row.classList.add('dragging');

  // Create ghost element
  const task = tasks.find(t => t.id === taskId);
  const visibleTasks = getVisibleTaskList();
  const vt = visibleTasks.find(v => v.task.id === taskId);
  const depth = vt ? vt.depth : 0;

  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.innerHTML = `<span class="ghost-indent" style="width:${depth * 16}px;"></span>${task.name}`;
  ghost.style.left = (x + 12) + 'px';
  ghost.style.top = (y - 12) + 'px';
  document.body.appendChild(ghost);
  dragState.ghostEl = ghost;

  // Create drop indicator
  const indicator = document.createElement('div');
  indicator.className = 'drop-indicator';
  indicator.style.display = 'none';
  leftBody.appendChild(indicator);
  dragState.indicatorEl = indicator;

  dragState.offsetX = 0;
}

function handleDragMove(x, y) {
  if (!dragState || !dragState.isDragging) {
    // Check if we've exceeded the threshold without starting drag
    if (dragState && !dragState.isDragging) {
      const dx = x - dragState.startX;
      const dy = y - dragState.startY;
      if (Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) {
        clearTimeout(dragState.timer);
        dragState = null;
      }
    }
    return;
  }

  // Move ghost
  if (dragState.ghostEl) {
    dragState.ghostEl.style.left = (x + 12) + 'px';
    dragState.ghostEl.style.top = (y - 12) + 'px';
  }

  // Calculate horizontal offset for indent level
  dragState.offsetX = x - dragState.startX;

  // Find the drop target row based on Y position
  const visibleTasks = getVisibleTaskList();
  const rows = leftBody.querySelectorAll('.task-row');
  if (rows.length === 0 || visibleTasks.length === 0) return;

  // Calculate the Y offset within leftBody
  const leftRect = leftBody.getBoundingClientRect();
  const mouseY = y - leftRect.top + leftBody.scrollTop;

  let targetIdx = -1;
  for (let i = 0; i < visibleTasks.length; i++) {
    const rowMid = i * ROW_HEIGHT + ROW_HEIGHT / 2;
    if (mouseY < rowMid) {
      targetIdx = i;
      break;
    }
  }
  if (targetIdx === -1) targetIdx = visibleTasks.length;

  // Don't show indicator if hovering over the dragged task itself
  if (targetIdx < visibleTasks.length && visibleTasks[targetIdx].task.id === dragState.taskId) {
    dragState.indicatorEl.style.display = 'none';
    return;
  }

  // Calculate target depth based on horizontal offset
  const draggedVT = visibleTasks.find(v => v.task.id === dragState.taskId);
  const origDepth = draggedVT ? draggedVT.depth : 0;
  let targetDepth = origDepth;
  if (dragState.offsetX > 30) {
    // Right: increase indent (max +1 per 30px, limited by depth of target row above)
    const maxUp = targetIdx > 0 ? visibleTasks[Math.min(targetIdx - 1, visibleTasks.length - 1)].depth + 1 : 0;
    targetDepth = Math.min(origDepth + Math.floor(dragState.offsetX / 30), maxUp, 9);
  } else if (dragState.offsetX < -30) {
    // Left: decrease indent
    targetDepth = Math.max(0, origDepth + Math.ceil(dragState.offsetX / 30));
  }

  // Show drop indicator
  if (dragState.indicatorEl) {
    const indicatorY = targetIdx * ROW_HEIGHT;
    dragState.indicatorEl.style.display = 'block';
    dragState.indicatorEl.style.top = indicatorY + 'px';
    dragState.indicatorEl.style.left = (targetDepth * 20 + 4) + 'px';
    dragState.indicatorEl.style.width = `calc(100% - ${targetDepth * 20 + 4}px)`;
  }

  // Store calculated target for drop
  dragState.targetIdx = targetIdx;
  dragState.targetDepth = targetDepth;
}

function handleDragEnd(x, y) {
  if (!dragState) return;

  if (dragState.isDragging && dragState.targetIdx !== undefined) {
    performDrop(dragState.taskId, dragState.targetIdx, dragState.targetDepth);
  }

  // Cleanup
  cleanupDrag();
}

function cleanupDrag() {
  if (!dragState) return;

  clearTimeout(dragState.timer);

  // Remove ghost
  if (dragState.ghostEl) dragState.ghostEl.remove();

  // Remove indicator
  if (dragState.indicatorEl) dragState.indicatorEl.remove();

  // Remove dragging class
  if (dragState.taskId) {
    const row = leftBody.querySelector(`[data-id="${dragState.taskId}"]`);
    if (row) row.classList.remove('dragging');
  }

  const wasDragging = dragState.isDragging;
  dragState = null;

  // Return whether a drag happened (for click suppression)
  return wasDragging;
}

function performDrop(taskId, targetIdx, targetDepth) {
  const visibleTasks = getVisibleTaskList();

  // Remove the task and its subtree from the array
  const task = tasks.find(t => t.id === taskId);
  if (!task) return;

  const subtreeIds = getSubtreeIds(taskId);
  const taskAndKids = tasks.filter(t => subtreeIds.includes(t.id));
  const others = tasks.filter(t => !subtreeIds.includes(t.id));

  // Calculate the new parentId based on target depth
  // We need to find which task at (targetDepth - 1) above the target position should be the new parent
  let newParentId = null;

  if (targetDepth > 0) {
    // Find the closest ancestor: walk upward from targetIdx to find a task at depth (targetDepth - 1)
    for (let i = targetIdx - 1; i >= 0; i--) {
      if (i >= visibleTasks.length) continue;
      const vt = visibleTasks[i];
      if (vt.task.id === taskId) continue; // skip the dragged task
      if (vt.depth === targetDepth - 1) {
        newParentId = vt.task.id;
        break;
      }
      if (vt.depth < targetDepth - 1) {
        // No suitable parent found at the right depth
        newParentId = null;
        break;
      }
    }
  }

  // Find the insert position in the 'others' array
  // We need to insert after the task at position (targetIdx - 1) in the visible list
  let insertIdx = others.length; // default: end
  if (targetIdx > 0 && targetIdx <= visibleTasks.length) {
    // Find the reference task (the one above the insertion point)
    let refIdx = targetIdx - 1;
    // If the reference task is the dragged task, go one more up
    if (refIdx >= 0 && refIdx < visibleTasks.length && visibleTasks[refIdx].task.id === taskId) {
      refIdx--;
    }
    if (refIdx >= 0 && refIdx < visibleTasks.length) {
      const refId = visibleTasks[refIdx].task.id;
      const refSubtree = getSubtreeIds(refId);
      const lastRefIdx = Math.max(...refSubtree.map(sid => others.findIndex(t => t.id === sid)));
      insertIdx = lastRefIdx + 1;
    }
  } else if (targetIdx === 0) {
    insertIdx = 0;
  }

  // Apply the change
  task.parentId = newParentId;
  others.splice(insertIdx, 0, ...taskAndKids);

  pushUndo();
  tasks = others;
  saveData();
  render();
}

// ============================================================
//  事件绑定
// ============================================================
function initEvents() {
  // Scroll sync
  rightBody.addEventListener('scroll', () => {
    syncScrollLeft();
    syncScrollTop();
  });

  // Left panel scroll sync → right follows
  leftBody.addEventListener('scroll', () => {
    rightBody.scrollTop = leftBody.scrollTop;
  });

  // Search
  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      filterQuery = searchInput.value;
      render();
    }, 200);
  });

  // --- 面板拖动 ---
  const panelHandle = $('panelResizeHandle');
  panelHandle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    panelResizeData = { startX: e.clientX, startWidth: leftPanel.offsetWidth };
    panelHandle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  // --- 列宽拖动 ---
  document.querySelectorAll('.col-resize-handle').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const col = handle.dataset.col;
      const parentSpan = handle.parentElement;
      colResizeData = { col, startX: e.clientX, startWidth: parentSpan.offsetWidth };
      handle.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });
  });

  // Zoom — 带视口中心保持
  function doZoom(fn) {
    const oldDw = getDayWidth();
    const vw = rightBody.clientWidth;
    // 视口中心距离时间轴最左侧的像素距离
    const centerX = rightBody.scrollLeft + vw / 2;
    // 视口中心距离时间轴最左侧的天数（浮点数）
    const centerDays = centerX / oldDw;

    fn();

    // 缩放后新的每天像素宽度
    const newDw = getDayWidth();
    // 视口中心距离时间轴最左侧的新像素距离
    const newCenterX = centerDays * newDw;
    
    // 同步设置 scrollLeft，避免闪烁和计算延迟
    rightBody.scrollLeft = Math.max(0, newCenterX - vw / 2);
    // 手动同步表头位置
    syncScrollLeft();
  }

  $('zoomOutBtn').addEventListener('click', () => {
    if (zoomIndex > 0) { zoomIndex--; updateZoomLabel(); doZoom(() => render()); }
  });
  $('zoomInBtn').addEventListener('click', () => {
    if (zoomIndex < ZOOM_LEVELS.length - 1) { zoomIndex++; updateZoomLabel(); doZoom(() => render()); }
  });

  // Ctrl+Wheel zoom
  rightBody.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      let changed = false;
      if (e.deltaY < 0 && zoomIndex < ZOOM_LEVELS.length - 1) { zoomIndex++; changed = true; }
      else if (e.deltaY > 0 && zoomIndex > 0) { zoomIndex--; changed = true; }
      if (changed) { updateZoomLabel(); doZoom(() => render()); }
    }
  }, { passive: false });

  // Today button
  $('todayBtn').addEventListener('click', syncScrollToday);

  // Task operations
  $('addBtn').addEventListener('click', () => {
    // 有选中任务时创建同级任务，否则创建顶层任务
    const siblingParent = selectedTaskId ? (tasks.find(t => t.id === selectedTaskId)?.parentId || null) : null;
    addTask(siblingParent);
  });
  $('addSubBtn').addEventListener('click', () => {
    if (selectedTaskId) {
      addTask(selectedTaskId);
    } else {
      showToast('请先选择一个父任务', 'error');
    }
  });
  $('deleteBtn').addEventListener('click', () => {
    if (selectedTaskId) deleteTask(selectedTaskId);
    else showToast('请先选择一个任务', 'error');
  });
  $('indentBtn').addEventListener('click', () => {
    if (selectedTaskId) indentTask(selectedTaskId);
    else showToast('请先选择一个任务', 'error');
  });
  $('outdentBtn').addEventListener('click', () => {
    if (selectedTaskId) outdentTask(selectedTaskId);
    else showToast('请先选择一个任务', 'error');
  });
  $('moveUpBtn').addEventListener('click', () => {
    if (selectedTaskId) moveTask(selectedTaskId, 'up');
    else showToast('请先选择一个任务', 'error');
  });
  $('moveDownBtn').addEventListener('click', () => {
    if (selectedTaskId) moveTask(selectedTaskId, 'down');
    else showToast('请先选择一个任务', 'error');
  });

  // Undo / Redo
  $('undoBtn').addEventListener('click', undo);
  $('redoBtn').addEventListener('click', redo);

  // Import / Export
  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      importData(e.target.files[0]);
      e.target.value = '';
    }
  });

  // Modal events
  $('modalClose').addEventListener('click', closeEditModal);
  $('modalCancel').addEventListener('click', closeEditModal);
  $('modalSave').addEventListener('click', saveFormData);

  // Milestone checkbox → auto set dates
  $('editIsMilestone').addEventListener('change', () => {
    if ($('editIsMilestone').checked && $('editStartDate').value) {
      $('editEndDate').value = $('editStartDate').value;
      $('editEndDate').disabled = true;
    } else {
      if (!$('editStartDate').disabled) $('editEndDate').disabled = false;
    }
  });
  // When start date changes and milestone is checked, sync end date
  $('editStartDate').addEventListener('change', () => {
    if ($('editIsMilestone').checked && $('editStartDate').value) {
      $('editEndDate').value = $('editStartDate').value;
    }
  });

  // Confirm dialog
  $('confirmCancel').addEventListener('click', () => {
    $('confirmDlg').classList.remove('show');
    const oc = $('confirmDlg')._onCancel;
    $('confirmDlg')._onCancel = null;
    if (oc) oc();
    confirmCallback = null;
    confirmMiddleCallback = null;
  });
  $('confirmMiddle').addEventListener('click', () => {
    $('confirmDlg').classList.remove('show');
    if (confirmMiddleCallback) { confirmMiddleCallback(); }
    confirmCallback = null;
    confirmMiddleCallback = null;
    $('confirmDlg')._onCancel = null;
  });
  $('confirmOk').addEventListener('click', () => {
    $('confirmDlg').classList.remove('show');
    if (confirmCallback) { confirmCallback(); }
    confirmCallback = null;
    confirmMiddleCallback = null;
    $('confirmDlg')._onCancel = null;
  });

  // Close modals on overlay click
  $('editModal').addEventListener('click', (e) => {
    if (e.target === $('editModal')) closeEditModal();
  });
  $('confirmDlg').addEventListener('click', (e) => {
    if (e.target === $('confirmDlg')) {
      $('confirmDlg').classList.remove('show');
      const oc = $('confirmDlg')._onCancel;
      $('confirmDlg')._onCancel = null;
      if (oc) oc();
      confirmCallback = null;
      confirmMiddleCallback = null;
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('editModal').classList.contains('show')) closeEditModal();
      else if ($('confirmDlg').classList.contains('show')) {
        $('confirmDlg').classList.remove('show');
        const oc = $('confirmDlg')._onCancel;
        $('confirmDlg')._onCancel = null;
        if (oc) oc();
        confirmCallback = null;
        confirmMiddleCallback = null;
      }
    }
    if (e.key === 'Enter' && $('editModal').classList.contains('show') && (e.ctrlKey || e.metaKey)) {
      saveFormData();
    }
    if (e.key === 'Delete' && !$('editModal').classList.contains('show') && selectedTaskId) {
      deleteTask(selectedTaskId);
    }
    // Undo/Redo
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      e.preventDefault();
      if (!$('editModal').classList.contains('show')) undo();
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
      e.preventDefault();
      if (!$('editModal').classList.contains('show')) redo();
    }
    if (e.key === 'Tab' && $('editModal').classList.contains('show')) {
      // Allow normal tab navigation in modal
    }
  });

  // Right-body click-drag horizontal scroll
  rightBody.addEventListener('mousedown', (e) => {
    const target = e.target;
    if (target === timelineContent || target.closest('.tc') === target || target === rightBody || target.closest('.gantt-bar-row') === target) {
      rightBody._isDragging = true;
      rightBody._dragStartX = e.clientX;
      rightBody._dragStartScroll = rightBody.scrollLeft;
      rightBody.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  document.addEventListener('mousemove', (e) => {
    // Task drag-and-drop
    if (dragState) {
      handleDragMove(e.clientX, e.clientY);
      return; // Don't process other drag handlers while task dragging
    }
    // Timeline click-drag scroll
    if (rightBody._isDragging) {
      const dx = e.clientX - rightBody._dragStartX;
      rightBody.scrollLeft = rightBody._dragStartScroll - dx;
    }
    // Panel width resize
    if (panelResizeData) {
      const delta = e.clientX - panelResizeData.startX;
      const newW = Math.max(300, Math.min(window.innerWidth - 200, panelResizeData.startWidth + delta));
      uiState.panelWidth = newW;
      leftPanel.style.width = newW + 'px';
      saveUiState();
    }
    // Column width resize
    if (colResizeData) {
      const delta = e.clientX - colResizeData.startX;
      const cfg = COL_CONFIG[colResizeData.col];
      if (cfg) {
        const newW = Math.max(cfg.min, colResizeData.startWidth + delta);
        document.documentElement.style.setProperty(cfg.cssVar, newW + 'px');
        uiState['col_' + colResizeData.col] = newW;
        saveUiState();
      }
    }
  });

  document.addEventListener('mouseup', (e) => {
    // Task drag-and-drop
    if (dragState) {
      handleDragEnd(e.clientX, e.clientY);
    }
    if (rightBody._isDragging) {
      rightBody._isDragging = false;
      rightBody.style.cursor = '';
    }
    if (panelResizeData) {
      panelResizeData = null;
      $('panelResizeHandle')?.classList.remove('dragging');
    }
    if (colResizeData) {
      colResizeData = null;
      document.querySelectorAll('.col-resize-handle').forEach(h => h.classList.remove('active'));
    }
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Window resize
  window.addEventListener('resize', () => { render(); });
}

function updateZoomLabel() {
  const pct = Math.round((getDayWidth() / ZOOM_LEVELS[DEFAULT_ZOOM_INDEX]) * 100);
  zoomLabel.textContent = pct + '%';
}

// ============================================================
//  初始化
// ============================================================
function init() {
  loadData();
  loadUiState();
  updateZoomLabel();
  render();
  initProgressSlider();
  initStatusBar();
  requestAnimationFrame(() => syncScrollToday());
  initEvents();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
